<svg fill="#02569B" role="img" viewBox="-5 -5 34 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 1. Expand alpha for border -->
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.8" result="d"/>
      <!-- 2. Sub-pixel anti-alias (0.15u ≈ <1px — smooths diagonal edges, not visible as blur) -->
      <feGaussianBlur in="d" stdDeviation="0.15" result="d_aa"/>
      <!-- 3. Fill white -->
      <feFlood flood-color="white" result="wf"/>
      <feComposite in="wf" in2="d_aa" operator="in" result="border"/>
      <!-- 4. Drop shadow from dilated shape -->
      <feGaussianBlur in="d" stdDeviation="2.5" result="sb"/>
      <feFlood flood-color="#000" flood-opacity="0.18" result="sf"/>
      <feComposite in="sf" in2="sb" operator="in" result="shadow"/>
      <feOffset in="shadow" dx="0" dy="1" result="shoff"/>
      <!-- 5. Merge -->
      <feMerge><feMergeNode in="shoff"/><feMergeNode in="border"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><title>Flutter</title><path d="M14.314 0L2.3 12 6 15.7 21.684.013h-7.357zm.014 11.072L7.857 17.53l6.47 6.47H21.7l-6.46-6.468 6.46-6.46h-7.37z"/></svg>